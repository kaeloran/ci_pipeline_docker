name: CI Pipeline Docker

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]

jobs:

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        go_version: ['1.22']
        os: ['ubuntu-latest']
    steps:
    - uses: actions/checkout@v6 

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ matrix.go_version }}        

    - name: Build-DB
      run: docker compose build
      
    - name: Create-DB
      run: docker compose up -d

    - name: Test
      run: |        
        export DB_HOST=localhost
        export DB_USER=root
        export DB_PASSWORD=root
        export DB_NAME=root  
        go test -v main_test.go
  
  build:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        go_version: ['1.22']
        os: ['ubuntu-latest']
    steps:
    - uses: actions/checkout@v3
    - name: Build
      run: |        
        export DB_HOST=localhost
        export DB_USER=root
        export DB_PASSWORD=root
        export DB_NAME=root  
        go build -v main.go
