name: Terraform

on:
  workflow_call:
    outputs:
      app_ip:
        description: "Public IP do servidor Go"
        value: ${{ jobs.terraform.outputs.app_ip }}
      db_endpoint:
        description: "Endpoint of the database"
        value: ${{ jobs.terraform.outputs.db_endpoint }}
      db_port:
        description: "Port of the database"
        value: ${{ jobs.terraform.outputs.db_port }}

permissions:
  id-token: write 
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    outputs:
      app_ip: ${{ steps.outputs.outputs.app_ip }}
      db_endpoint: ${{ steps.outputs.outputs.db_endpoint }}
      db_port: ${{ steps.outputs.outputs.db_port }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1  

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2.0.3
        with:
          terraform_version: 1.7.5

      - name: Terraform init
        run: terraform init
        working-directory: ./terraform

      - name: Terraform plan
        run: terraform plan -out=tfplan
        working-directory: ./terraform
      
      - name: Terraform apply
        run: terraform apply -auto-approve tfplan
        working-directory: ./terraform

      - name: Collect outputs
        id: outputs
        working-directory: ./terraform
        run: |
          ip=$(terraform output -raw alura_go_api_dev_public_ip)
          echo "app_ip=$ip" >> $GITHUB_OUTPUT
          db_endpoint=$(terraform output -raw db_endpoint)
          echo "db_endpoint=$db_endpoint" >> $GITHUB_OUTPUT
          db_port=$(terraform output -raw db_port)
          echo "db_port=$db_port" >> $GITHUB_OUTPUT